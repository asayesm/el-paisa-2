<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card">
        <div class="card-body">
          <h4 class="text-center mb-4">Iniciar sesión</h4>

          <label class="form-label">Usuario</label>
          <input class="form-control mb-3" type="text" [(ngModel)]="usuario" />

          <label class="form-label">Contraseña</label>
          <input class="form-control mb-3" type="password" [(ngModel)]="clave" />

          <button class="btn btn-warning w-100" (click)="ingresar()">Ingresar</button>

          <div class="alert alert-danger mt-3" *ngIf="error !== ''">{{ error }}</div>

        </div>
      </div>
    </div>
  </div>
</section>
